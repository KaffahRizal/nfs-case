<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFS Drop - Unlock</title>
<style>
  :root { --bg:#0b1220; --card:#111c30; --line:#1f3355; --fg:#e6eefc; --muted:#8aa2c8; --accent:#38bdf8; --ok:#34d399; --bad:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(1200px 600px at 50% -10%, #14315c 0%, var(--bg) 60%); color:var(--fg); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding:24px; }
  .card { width:100%; max-width:640px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.45); }
  h1 { font-size:18px; margin:0 0 6px; letter-spacing:.5px; }
  p.sub { color:var(--muted); font-size:13px; margin:0 0 20px; line-height:1.6; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:8px; text-transform:uppercase; letter-spacing:.08em; }
  input { width:100%; padding:12px 14px; background:#0a1424; color:var(--fg); border:1px solid var(--line); border-radius:9px; font:inherit; font-size:14px; outline:none; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(56,189,248,.15); }
  button { margin-top:14px; width:100%; padding:12px 14px; background:var(--accent); color:#04121f; border:0; border-radius:9px; font:inherit; font-weight:700; cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  #out { margin-top:18px; padding:16px; border-radius:9px; background:#0a1424; border:1px dashed var(--line); font-size:14px; word-break:break-all; min-height:52px; line-height:1.6; }
  .ok { color:var(--ok); font-weight:700; }
  .bad { color:var(--bad); }
  .hint { margin-top:16px; font-size:11.5px; color:var(--muted); line-height:1.6; }
  code { color:var(--accent); }
</style>
</head>
<body>
  <main class="card">
    <h1>NFS SECURE DROP / UNLOCK</h1>
    <p class="sub">Artefak ini terenkripsi. Masukkan passphrase hasil investigasi untuk membuka isi drop.</p>
    <label for="p">Passphrase</label>
    <input id="p" type="text" autocomplete="off" spellcheck="false" placeholder="jawaban1-jawaban2-...-jawaban7">
    <button id="go">Buka</button>
    <div id="out">Menunggu passphrase...</div>
    <div class="hint">
      Format: gabungkan tujuh temuan dengan tanda <code>-</code>, huruf kecil,
      tanpa spasi (urutan: alias, repo, handle blog, tanggal, landmark, kota, IP).
    </div>
  </main>
<script>
const B64 = "S91Ni/HNJgWJSqyMfnqJtt4P765JMJZvScR58NwS0cTTPmlUUiGIlhI93uHGoYxic+h9Wyf4lB1gIZhGn1Og";
const out = document.getElementById("out");
const enc = new TextEncoder();
const dec = new TextDecoder();

function b64bytes(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function unlock() {
  const pass = document.getElementById("p").value.trim();
  if (!pass) { out.className = "bad"; out.textContent = "Passphrase kosong."; return; }
  out.className = ""; out.textContent = "Membuka...";
  try {
    const data = b64bytes(B64);
    const salt = data.slice(0, 16);
    const iv = data.slice(16, 28);
    const ct = data.slice(28);
    const baseKey = await crypto.subtle.importKey(
      "raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]
    );
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256" },
      baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
    );
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv, tagLength: 128 }, key, ct);
    out.className = "ok";
    out.textContent = dec.decode(pt);
  } catch (e) {
    out.className = "bad";
    out.textContent = "Passphrase salah. Periksa kembali urutan dan format jawaban.";
  }
}

document.getElementById("go").addEventListener("click", unlock);
document.getElementById("p").addEventListener("keydown", (e) => { if (e.key === "Enter") unlock(); });
</script>
</body>
</html>
